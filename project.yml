name: BJJBul
options:
  bundleIdPrefix: com.bjjbul
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: bg
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BJJBul:
    type: application
    platform: iOS
    sources:
      - path: BJJBul
        excludes:
          - "Resources/Legal/**"
      - path: BJJBul/Resources/Legal
        type: folder
        buildPhase: resources
    entitlements:
      path: BJJBul/BJJBul.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Xcode/App Store export switches this to production when distributing.
        aps-environment: development
    info:
      path: BJJBul/Info.plist
      properties:
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        UIBackgroundModes:
          - remote-notification
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bjjbul.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: BJJ Bul
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Used to show BJJ gyms near you."
        INFOPLIST_KEY_NSCameraUsageDescription: "Used to take photos and record videos for your posts."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used to record sound in videos for your posts."
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Used to add competitions and open mats to your calendar."
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BJJBulTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BJJBulTests
    dependencies:
      - target: BJJBul
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bjjbul.tests
schemes:
  BJJBul:
    build:
      targets:
        BJJBul: all
    test:
      targets:
        - BJJBulTests
